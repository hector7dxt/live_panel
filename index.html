<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realtime Board — Pro</title>
  <style>
    :root {
      --bg: #f5f7fb; 
      --board-bg: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      --card: #ffffff; 
      --text: #222222; 
      --muted: #777777;
      --border: #eeeeee;
      --accent: #667eea; 
      --accent-hover: #5a67d8;
      --danger: #e53e3e;
      --success: #38a169;
      --warning: #d69e2e;
    }
    
    [data-theme="dark"] {
      --bg: #111827;
      --board-bg: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #818cf8;
      --accent-hover: #6366f1;
    }

    * { box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Roboto; background: var(--bg); color: var(--text); margin: 0; padding: 28px; transition: background 0.3s ease, color 0.3s ease; }
    
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    h1 { font-size: 20px; color: var(--text); margin: 0; }
    
    .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    button { background: var(--accent); color: #fff; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    
    .small-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 8px; font-weight: 400; }
    .small-btn:hover { background: var(--border); }
    .icon-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    
    .board-wrap { overflow: auto; padding: 12px; border-radius: 12px; }
    .board { display: flex; gap: 14px; align-items: flex-start; padding: 18px; min-height: 220px; background: var(--board-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: background 0.3s; flex-wrap: wrap; }
    
    /* Tarjetas */
    .card { width: 260px; min-height: 160px; background: var(--card); border-radius: 12px; padding: 12px 12px 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 8px; cursor: grab; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .card.dragging { opacity: 0; /* Oculta la original al arrastrar */ }
    
    /* Espacio fantasma Drag & Drop */
    .drop-placeholder { width: 260px; min-height: 160px; border: 2px dashed var(--accent); border-radius: 12px; background: rgba(102, 126, 234, 0.05); }

    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .card-number { background: var(--border); color: var(--text); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; }
    
    .card-title { font-weight: 600; color: var(--text); font-size: 14px; min-width: 0; outline: none; border: none; background: transparent; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
    .card-title[contenteditable="true"]:focus { box-shadow: 0 0 0 2px rgba(102,126,234,0.3); border-radius: 4px; overflow: visible; white-space: normal; }
    
    .card-actions { display: flex; gap: 4px; }
    .small-icon-btn { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .small-icon-btn:hover { background: var(--border); color: var(--text); }
    .btn-delete:hover { background: rgba(229, 62, 62, 0.1); color: var(--danger); }
    
    .card-content, .card-extra { font-size: 13px; color: var(--text); padding: 8px; border-radius: 8px; border: 1px solid var(--border); outline: none; overflow: auto; cursor: text; white-space: pre-wrap; word-break: break-word; }
    .card-content { flex: 1; min-height: 80px; }
    .card-extra { min-height: 40px; font-size: 12px; color: var(--muted); }
    .card-content[contenteditable="true"]:focus, .card-extra[contenteditable="true"]:focus { border-color: var(--accent); background: rgba(102, 126, 234, 0.03); }
    
    /* Archivos */
    .card-attachment { padding: 4px; }
    .btn-download { display: block; text-align: center; text-decoration: none; width: 100%; margin-bottom: 4px; font-size: 13px; font-weight: 500; background: rgba(56, 161, 105, 0.1); color: var(--success); border-color: rgba(56, 161, 105, 0.3); }
    .btn-download:hover { background: rgba(56, 161, 105, 0.2); }
    
    .progress-container { display: none; margin-bottom: 8px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s ease, background 0.3s ease; }
    .progress-text { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; font-weight: 500; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; }
    .muted { color: var(--muted); font-size: 11px; }
    .status-badge { font-size: 11px; font-weight: 500; }
    
    .empty { color: var(--muted); padding: 40px; text-align: center; width: 100%; font-size: 14px; }
    
    /* Esqueleto Animado */
    @keyframes pulse { 0%, 100% {opacity: 1;} 50% {opacity: 0.4;} }
    .skeleton-card { width: 260px; height: 220px; background: var(--border); border-radius: 12px; animation: pulse 1.5s infinite; }

    @media (max-width:700px){.board{padding:12px;gap:10px}.card{width:100%}.skeleton-card{width: 100%;}}
  </style>
</head>
<body>
  <header>
    <h1>Panel Vivo — Pro</h1>
    <div class="controls">
      <button id="themeToggleBtn" class="icon-btn" title="Cambiar tema">🌙</button>
      <button id="addCardBtn">➕ Añadir Tarjeta</button>
      <button id="clearAllBtn" class="small-btn">🗑 Limpiar Todo</button>
    </div>
  </header>

  <div class="board-wrap">
    <!-- Skeleton loader para espera activa -->
    <div id="skeletonLoader" class="board">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    
    <div id="board" class="board" aria-live="polite" style="display:none;"></div>
    <div id="emptyMsg" class="empty" style="display:none">El panel está vacío. Crea la primera tarjeta.</div>
  </div>

  <!-- Firebase Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
  /***********************
   * CONFIGURA AQUÍ tu Firebase
   ***********************/
  const firebaseConfig = {
    apiKey: "AIzaSyBkpcGEZ31B59cS_2HmVPWwBFNGrTq8EdY",
    authDomain: "pruebacards-aa8b8.firebaseapp.com",
    projectId: "pruebacards-aa8b8",
    storageBucket: "pruebacards-aa8b8.appspot.com",
    messagingSenderId: "919397052566",
    appId: "1:919397052566:web:3e8722f2256bc365c6d2b7",
    measurementId: "G-YYRL2WEE67"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /***********************
   * UI y Modo Oscuro
   ***********************/
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  let isDark = localStorage.getItem('theme') === 'dark';
  
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggleBtn.textContent = '☀️';
  }

  themeToggleBtn.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
  });

  const boardEl = document.getElementById('board');
  const skeletonEl = document.getElementById('skeletonLoader');
  const addCardBtn = document.getElementById('addCardBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const emptyMsg = document.getElementById('emptyMsg');

  /***********************
   * Herramientas (Debounce, Auto-link, Escapes)
   ***********************/
  function debounce(fn, wait = 1500) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function linkify(text) {
    if (!text) return '';
    const escaped = escapeHtml(text);
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return escaped.replace(urlRegex, (url) => {
      // Se utiliza contenteditable="false" para que al editar texto cerca, el usuario no rompa la estructura HTML
      return `<a href="${url}" target="_blank" contenteditable="false" style="color: var(--accent); text-decoration: underline;">${url}</a>`;
    });
  }

  /***********************
   * Crear Nodo DOM
   ***********************/
  function createCardNode(cardDoc, indexForNumbering) {
    const data = cardDoc.data();
    const id = cardDoc.id;

    const el = document.createElement('div');
    el.className = 'card';
    el.draggable = true;
    el.dataset.id = id;
    el.dataset.uploading = "false";

    el.innerHTML = `
      <div class="card-header">
        <div class="card-left">
          <div class="card-number">#${indexForNumbering}</div>
          <div class="card-title" contenteditable="true" spellcheck="false" aria-label="Título"></div>
        </div>
        <div class="card-actions">
          <button class="small-icon-btn btn-copy" title="Copiar al portapapeles">📋</button>
          <button class="small-icon-btn btn-delete" title="Borrar">✖</button>
        </div>
      </div>

      <div class="card-content" contenteditable="true" spellcheck="false" aria-label="Contenido"></div>
      <div class="card-extra" contenteditable="true" spellcheck="false" aria-label="Extras"></div>

      <div class="card-attachment">
        <input type="file" class="file-input" style="display:none;" />
        <button class="small-btn btn-upload" style="width: 100%;">📎 Subir archivo (Max 50MB)</button>
        
        <div class="progress-container">
          <div class="progress-bar"><div class="progress-fill"></div></div>
          <div class="progress-text">0%</div>
        </div>
        <div class="file-link-container"></div>
      </div>

      <div class="card-footer">
        <div class="muted updated-at">--</div>
        <div class="status-badge"></div>
      </div>
    `;

    const titleEl = el.querySelector('.card-title');
    const mainEl = el.querySelector('.card-content');
    const extraEl = el.querySelector('.card-extra');
    const updatedAtEl = el.querySelector('.updated-at');
    const statusBadge = el.querySelector('.status-badge');
    
    const fileInput = el.querySelector('.file-input');
    const btnUpload = el.querySelector('.btn-upload');
    const fileLinkContainer = el.querySelector('.file-link-container');
    const progressContainer = el.querySelector('.progress-container');
    const progressFill = el.querySelector('.progress-fill');
    const progressText = el.querySelector('.progress-text');

    // Función auxiliar para estado de guardado
    const setStatus = (state) => {
       if (state === 'saving') {
         statusBadge.textContent = '⏳ Guardando...';
         statusBadge.style.color = 'var(--warning)';
       } else if (state === 'saved') {
         statusBadge.textContent = '✅ Guardado';
         statusBadge.style.color = 'var(--success)';
         setTimeout(() => { if (statusBadge.textContent === '✅ Guardado') statusBadge.textContent = ''; }, 2000);
       }
    };

    // Inicialización de textos con Linkify
    titleEl.textContent = data.title || '';
    mainEl.innerHTML = linkify(data.text);
    extraEl.innerHTML = linkify(data.extra);
    
    if (data.updatedAt) {
      const dt = new Date(data.updatedAt.seconds * 1000);
      updatedAtEl.textContent = `${dt.getHours().toString().padStart(2, '0')}:${dt.getMinutes().toString().padStart(2, '0')}`;
    }

    // Configuración de la descarga directa nativa
    if (data.fileUrl) {
      btnUpload.style.display = 'none';
      fileLinkContainer.innerHTML = `<a href="${data.fileUrl}" download="${data.fileName || 'archivo'}" class="small-btn btn-download">⬇️ Descargar ${data.fileName || ''}</a>`;
    }

    /***** Copiar al portapapeles *****/
    el.querySelector('.btn-copy').addEventListener('click', (ev) => {
      ev.stopPropagation();
      const content = `${titleEl.innerText}\n\n${mainEl.innerText}\n\n${extraEl.innerText}`;
      navigator.clipboard.writeText(content.trim());
      
      const btn = ev.target;
      btn.textContent = '✅';
      setTimeout(() => btn.textContent = '📋', 1500);
    });

    /***** Subida de Archivos con Tmpfiles *****/
    let currentUploadTask = null;

    btnUpload.addEventListener('click', (ev) => { ev.stopPropagation(); fileInput.click(); });

    fileInput.addEventListener('change', (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      if (file.size > 50 * 1024 * 1024) { alert("Límite de 50MB excedido."); return; }

      el.dataset.uploading = "true";
      btnUpload.style.display = 'none';
      progressContainer.style.display = 'block';
      progressFill.style.width = '0%';
      progressText.innerText = 'Iniciando...';

      currentUploadTask = new XMLHttpRequest();
      currentUploadTask.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressFill.style.width = percent + '%';
          progressText.innerText = `Subiendo... ${percent}%`;
        }
      });

      currentUploadTask.addEventListener('load', async () => {
        if (currentUploadTask.status >= 200 && currentUploadTask.status < 300) {
          const response = JSON.parse(currentUploadTask.responseText);
          const directUrl = response.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          
          progressText.innerText = "✅ Subido";
          progressFill.style.background = "var(--success)";
          
          await db.collection('cards').doc(id).update({
            fileUrl: directUrl,
            fileName: file.name,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          setTimeout(() => {
            progressContainer.style.display = 'none';
            el.dataset.uploading = "false";
            currentUploadTask = null;
          }, 1500);
        } else {
          el.dataset.uploading = "false";
          progressContainer.style.display = 'none';
          btnUpload.style.display = 'block';
          currentUploadTask = null;
        }
      });

      currentUploadTask.addEventListener('abort', () => currentUploadTask = null);
      currentUploadTask.open('POST', 'https://tmpfiles.org/api/v1/upload');
      
      const formData = new FormData();
      formData.append('file', file);
      currentUploadTask.send(formData);
    });

    /***** Borrado y Aborto *****/
    el.querySelector('.btn-delete').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm('¿Eliminar tarjeta?')) return;
      if (currentUploadTask) currentUploadTask.abort();
      await db.collection('cards').doc(id).delete();
    });

    /***** Auto-Guardado en la Base de Datos *****/
    const saveTitle = debounce(async (val) => { await db.collection('cards').doc(id).update({title: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}); setStatus('saved'); });
    const saveMain = debounce(async (val) => { await db.collection('cards').doc(id).update({text: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}); setStatus('saved'); });
    const saveExtra = debounce(async (val) => { await db.collection('cards').doc(id).update({extra: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}); setStatus('saved'); });

    titleEl.addEventListener('input', (e) => { setStatus('saving'); saveTitle(e.target.innerText.trim()); });
    mainEl.addEventListener('input', (e) => { setStatus('saving'); saveMain(e.target.innerText); });
    extraEl.addEventListener('input', (e) => { setStatus('saving'); saveExtra(e.target.innerText); });

    // Evitar que inicie el drag al hacer click en zonas de texto
    [titleEl, mainEl, extraEl].forEach(node => {
      node.addEventListener('mousedown', (e) => e.stopPropagation());
    });

    /***** Drag & Drop Lógica Local *****/
    el.addEventListener('dragstart', (e) => {
      window.draggingNode = el;
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', id);
      setTimeout(() => el.style.display = 'none', 0); // Oculta original
    });

    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      el.style.display = ''; // Restaura
      window.draggingNode = null;
      if(window.dragPlaceholder && window.dragPlaceholder.parentNode) {
        window.dragPlaceholder.parentNode.removeChild(window.dragPlaceholder);
      }
    });

    return el;
  }

  /***********************
   * Ghosting Global (Espacio Fantasma)
   ***********************/
  window.dragPlaceholder = document.createElement('div');
  window.dragPlaceholder.className = 'drop-placeholder';
  window.draggingNode = null;

  boardEl.addEventListener('dragover', e => {
    e.preventDefault();
    if (!window.draggingNode) return;
    
    const afterEl = getDragAfterElement(boardEl, e.clientX);
    if (afterEl == null) {
      boardEl.appendChild(window.dragPlaceholder);
    } else {
      boardEl.insertBefore(window.dragPlaceholder, afterEl);
    }
  });

  boardEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    if (!window.draggingNode) return;
    const id = window.draggingNode.dataset.id;
    
    // Intercambiar placeholder visual por nodo real instantáneamente
    if (window.dragPlaceholder.parentNode) {
      boardEl.insertBefore(window.draggingNode, window.dragPlaceholder);
    }

    // Calcular y guardar nueva posición
    const nodes = Array.from(boardEl.querySelectorAll('.card:not(.drop-placeholder)'));
    const idx = nodes.indexOf(window.draggingNode);
    let newPos;
    
    if (idx === 0) {
      const next = await getCardData(nodes[1]);
      newPos = next ? next.position - 1000 : Date.now();
    } else if (idx === nodes.length - 1) {
      const prev = await getCardData(nodes[idx - 1]);
      newPos = prev ? prev.position + 1000 : Date.now();
    } else {
      const prev = await getCardData(nodes[idx - 1]);
      const next = await getCardData(nodes[idx + 1]);
      newPos = ((prev.position || 0) + (next.position || 0)) / 2;
    }

    if (newPos) {
      await db.collection('cards').doc(id).update({
        position: newPos,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  });

  function getDragAfterElement(container, x) {
    const draggableElements = [...container.querySelectorAll('.card:not(.dragging):not(.drop-placeholder)')];
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = x - box.left - box.width / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
  }

  async function getCardData(node) {
    if (!node) return null;
    const doc = await db.collection('cards').doc(node.dataset.id).get();
    return doc.exists ? doc.data() : null;
  }

  /***********************
   * Sincronización en Tiempo Real
   ***********************/
  function startRealtime() {
    db.collection('cards').orderBy('position', 'asc').onSnapshot(snapshot => {
      
      // Ocultar esqueleto y mostrar tablero
      skeletonEl.style.display = 'none';
      boardEl.style.display = 'flex';

      const docs = snapshot.docs;
      if (docs.length === 0) {
        boardEl.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      } else {
        emptyMsg.style.display = 'none';
      }

      const existingMap = {};
      Array.from(boardEl.querySelectorAll('.card')).forEach(node => { existingMap[node.dataset.id] = node; });

      const fragment = document.createDocumentFragment();

      docs.forEach((doc, idx) => {
        const id = doc.id;
        const data = doc.data();

        if (existingMap[id]) {
          const node = existingMap[id];
          
          const numEl = node.querySelector('.card-number');
          if (numEl) numEl.textContent = `#${idx + 1}`;

          const footerTime = node.querySelector('.updated-at');
          if (footerTime && data.updatedAt) {
            const dt = new Date(data.updatedAt.seconds * 1000);
            footerTime.innerText = `${dt.getHours().toString().padStart(2, '0')}:${dt.getMinutes().toString().padStart(2, '0')}`;
          }

          if (node.dataset.uploading !== "true") {
            const btnUpload = node.querySelector('.btn-upload');
            const fileLinkContainer = node.querySelector('.file-link-container');
            
            if (data.fileUrl) {
              if (btnUpload) btnUpload.style.display = 'none';
              if (fileLinkContainer && !fileLinkContainer.innerHTML.includes(data.fileUrl)) {
                fileLinkContainer.innerHTML = `<a href="${data.fileUrl}" download="${data.fileName || 'archivo'}" class="small-btn btn-download">⬇️ Descargar ${data.fileName || ''}</a>`;
              }
            } else {
              if (btnUpload) btnUpload.style.display = 'block';
              if (fileLinkContainer) fileLinkContainer.innerHTML = '';
            }
          }

          const titleEl = node.querySelector('.card-title');
          const mainEl = node.querySelector('.card-content');
          const extraEl = node.querySelector('.card-extra');

          // Solo aplica la actualización si el usuario NO está editando ese cuadro
          if (document.activeElement !== titleEl && titleEl.innerText !== (data.title || '')) {
            titleEl.textContent = data.title || '';
          }
          if (document.activeElement !== mainEl) {
            const currentRaw = mainEl.innerText;
            const newRaw = data.text || '';
            if (currentRaw !== newRaw) mainEl.innerHTML = linkify(newRaw);
          }
          if (document.activeElement !== extraEl) {
             const currentRaw = extraEl.innerText;
             const newRaw = data.extra || '';
             if (currentRaw !== newRaw) extraEl.innerHTML = linkify(newRaw);
          }

          fragment.appendChild(node);
        } else {
          fragment.appendChild(createCardNode(doc, idx + 1));
        }
      });

      // Asegurar que el placeholder siga existiendo si estamos a mitad de un arrastre durante una sincronización externa
      if (window.draggingNode && window.dragPlaceholder.parentNode) {
         boardEl.insertBefore(window.dragPlaceholder, window.dragPlaceholder.nextSibling);
      }

      boardEl.innerHTML = '';
      boardEl.appendChild(fragment);
    });
  }

  startRealtime();

  /***********************
   * Controles Principales
   ***********************/
  addCardBtn.addEventListener('click', async () => {
    await db.collection('cards').add({
      title: '', text: '📝 Escribe algo o pega enlaces...', extra: '', position: Date.now(), updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });

  clearAllBtn.addEventListener('click', async () => {
    if (!confirm('¿Eliminar permanentemente todo el contenido?')) return;
    const snapshot = await db.collection('cards').get();
    const batch = db.batch();
    snapshot.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
  });

  </script>
</body>
</html>
