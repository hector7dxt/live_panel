<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Vivo — Pro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Overlay de Inicio de Sesión -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h2>Panel Vivo</h2>
      <p>Accede a tu tablero privado</p>
      <input type="text" id="loginUser" class="login-input" placeholder="Usuario (ej. hector)" />
      <input type="password" id="loginPass" class="login-input" placeholder="Contraseña" />
      <button id="loginBtn" style="width: 100%; margin-top: 10px;">Ingresar al Panel</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- Contenedor Principal de la App -->
  <div id="appContainer" class="app-container">
    <header>
      <h1>Panel Vivo <span id="userNameDisplay" style="font-size: 14px; color: var(--muted); font-weight: normal; margin-left: 8px;"></span></h1>
      
      <!-- Pestañas de Navegación -->
      <div class="view-tabs">
        <button id="tabPrivate" class="tab-btn active">👤 Mi Tablero</button>
        <button id="tabPublic" class="tab-btn">🌍 Espacio Compartido</button>
      </div>

      <div class="controls">
        <!-- NUEVO: Buscador y Alternador de Vista -->
        <input type="text" id="searchInput" class="login-input search-box" placeholder="🔍 Buscar tarjeta..." />
        <button id="viewToggleBtn" class="icon-btn" title="Alternar Cuadrícula/Lista">🔲</button>
        
        <button id="qrBtn" class="icon-btn" title="Mostrar código QR">📱 QR</button>
        <button id="themeToggleBtn" class="icon-btn" title="Cambiar tema">🌙</button>
        <button id="autoDeleteBtn" class="small-btn" title="Borrar tarjetas de > 24 horas">⏳ Limpieza: OFF</button>
        <button id="addCardBtn">➕ Añadir Tarjeta</button>
        <button id="clearAllBtn" class="small-btn hide-on-lock">🗑 Limpiar Todo</button>
        <button id="logoutBtn" class="small-btn" style="color: var(--danger);">Salir</button>
      </div>
    </header>

    <div class="board-wrap">
      <div id="skeletonLoader" class="board">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <div id="board" class="board" aria-live="polite" style="display:none;"></div>
      <div id="emptyMsg" class="empty" style="display:none">Este panel está vacío. Crea la primera tarjeta.</div>
    </div>
  </div>

  <!-- Modal para Código QR -->
  <div id="qrModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3 style="margin-top:0; color:var(--text);">Escanea para acceder</h3>
      <img id="qrImage" src="" alt="Código QR">
    </div>
  </div>

  <!-- Firebase Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Archivo JavaScript Principal -->
  <script src="js/app.js"></script>
</body>
</html>
